# Does the demo still work against the callbacks release we pin?
#
# The failure this catches is a cloner's, not ours: someone copies canary/,
# installs the pinned wheel, and finds the run opens but carries no tags. The
# callback library degrades to a no-op by default rather than raising, so that
# failure is silent unless something asserts on what landed.

name: Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  # Sent by alidade-callbacks when it publishes a release, so a breaking change
  # is reported against its consumers rather than found later by whoever
  # cloned this next.
  repository_dispatch:
    types: [callbacks-released]

permissions:
  contents: read
  issues: write

jobs:
  demo:
    name: Run the canary demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned callbacks release
        run: |
          python -m pip install --upgrade pip
          pip install -r canary/requirements.txt pytest pyyaml

      - name: The wheel provides the package it claims to
        run: python -c "import alidade_callbacks; print(alidade_callbacks.__file__)"

      - name: Run the demo and assert what landed
        id: demo
        run: pytest tests/ -q

      # A scheduled check that goes quietly red is a check nobody reads. Unlike
      # alidade-callbacks' dep-watch, which only fires when a new version
      # appears, this runs weekly regardless — so it dedupes, or a lasting
      # breakage files an issue every Monday.
      - name: Report a broken demo
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'demo-broken';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.data.length > 0) {
              core.info(`#${open.data[0].number} is already open; not filing another.`);
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const trigger = context.eventName === 'repository_dispatch'
              ? `a new \`alidade-callbacks\` release`
              : `the ${context.eventName} run`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'The canary demo no longer works against its pinned callbacks',
              labels: [label],
              body: [
                `Triggered by ${trigger}.`,
                ``,
                `**Anyone who cloned this repo has the same breakage.** The demo`,
                `installs the wheel pinned in \`canary/requirements.txt\`, runs`,
                `\`canary/train.py\`, and asserts what reached Aim. One of those`,
                `stopped working.`,
                ``,
                `**Run**: ${runUrl}`,
                ``,
                `Reproduce:`,
                '```',
                `pip install -r canary/requirements.txt pytest pyyaml`,
                `pytest tests/ -q`,
                '```',
                ``,
                `If a newer callbacks release fixes it, move the pin in`,
                `\`canary/requirements.txt\` and close this. If the release is`,
                `genuinely breaking, say so on the callbacks release before`,
                `anyone else installs it.`,
              ].join('\n'),
            });
