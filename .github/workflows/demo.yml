# Does the demo still work against the callbacks release we pin?
#
# The failure this catches is a cloner's, not ours: someone copies canary/,
# installs the pinned wheel, and finds the run opens but carries no tags. The
# callback library degrades to a no-op by default rather than raising, so that
# failure is silent unless something asserts on what landed.

name: Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: Run the canary demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned callbacks release
        run: |
          python -m pip install --upgrade pip
          pip install -r canary/requirements.txt pytest

      - name: The wheel provides the package it claims to
        run: python -c "import alidade_callbacks; print(alidade_callbacks.__file__)"

      - name: Run the demo and assert what landed
        run: pytest tests/ -q
